    /* ===== report-specific layout ===== */
    html, body { height: 100%; }

    /* CodeMie-style ambient brand gradient layered over the solid page background.
       Per-theme: a deeper purple→blue wash in dark, a soft tint in light. */
    :root, :root.dark {
      --report-page-bg:
        radial-gradient(118% 88% at 100% 0%, rgba(132, 83, 210, 0.16), transparent 58%),
        radial-gradient(100% 72% at 0% 100%, rgba(0, 120, 194, 0.12), transparent 55%),
        var(--color-bg-page);
    }
    :root.light, .light {
      --report-page-bg:
        radial-gradient(118% 88% at 100% 0%, rgba(132, 83, 210, 0.14), transparent 60%),
        radial-gradient(100% 72% at 0% 100%, rgba(0, 122, 255, 0.13), transparent 58%),
        var(--color-bg-page);
    }
    body { margin: 0; padding: 0; overflow: hidden; background: var(--report-page-bg); background-attachment: fixed; }
    .shell { display: flex; height: 100vh; background: transparent; }

    /* sidebar — frosted over the gradient so the rail stays distinct without a hard fill.
       A CodeMie-brand radial glow (purple→blue) is anchored at the bottom-left corner, as
       in the product chrome. Layered as a fixed background (background-attachment: scroll is
       the default for a scroll container, so the glow stays pinned to the corner, not the
       scrolled content). The first `background:` is the no-color-mix fallback. */
    .side {
      position: relative;
      width: 232px; flex-shrink: 0;
      background: var(--color-bg-card);
      background:
        radial-gradient(135% 80% at -10% 116%, rgba(132, 83, 210, 0.34) 0%, rgba(34, 151, 246, 0.12) 44%, transparent 72%),
        color-mix(in srgb, var(--color-bg-card) 82%, transparent);
      backdrop-filter: blur(8px);
      border-right: 1px solid var(--color-border-structural);
      display: flex; flex-direction: column;
      padding: 16px 12px; overflow-y: auto;
    }
    :root.light .side, .light .side {
      background: var(--color-bg-card);
      background:
        radial-gradient(135% 80% at -10% 116%, rgba(132, 83, 210, 0.18) 0%, rgba(34, 151, 246, 0.09) 46%, transparent 74%),
        color-mix(in srgb, var(--color-bg-card) 90%, transparent);
    }
    .side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
    .side .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #2297F6, #7C5CFC); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 15px; }
    .nav-group { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); font-weight: 600; margin: 14px 8px 6px; }
    .nav-i { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--color-text-muted); font-size: 13.5px; cursor: pointer; user-select: none; }
    .nav-i:hover { background: var(--color-bg-tertiary); color: var(--color-text-primary); }
    .nav-i.active { background: var(--color-bg-tertiary); color: var(--color-text-primary); font-weight: 600; }
    .nav-i .ic { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; opacity: .85; flex-shrink: 0; }
    .nav-i .ic svg { width: 15px; height: 15px; display: block; }
    .nav-i .lock { margin-left: auto; }
    .side-foot { margin-top: auto; font-size: 11px; color: var(--color-text-muted); padding: 10px 8px 4px; line-height: 1.5; }

    /* main + topbar */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: transparent; }
    .topbar { min-height: 52px; border-bottom: 1px solid var(--color-border-structural); display: flex; align-items: center; gap: 10px; padding: 10px 22px; flex-wrap: wrap; background: var(--color-bg-page); background: color-mix(in srgb, var(--color-bg-page) 70%, transparent); backdrop-filter: blur(8px); }
    .scroll { flex: 1; overflow-y: auto; padding: 22px; background: transparent; }
    .fl-label { font-size: 11px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .04em; }
    .seg { display: inline-flex; border: 1px solid var(--color-border-structural); border-radius: 8px; overflow: hidden; }
    .seg button { background: transparent; border: none; color: var(--color-text-muted); padding: 5px 11px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
    .seg button.on { background: var(--color-bg-tertiary); color: var(--color-text-primary); font-weight: 600; }
    .chip-tog { border: 1px solid var(--color-border-structural); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--color-text-primary); user-select: none; }
    .chip-tog .dot { width: 9px; height: 9px; border-radius: 50%; }
    .chip-tog.off { opacity: .4; }
    .live { margin-left: auto; font-size: 11px; color: var(--color-success); display: flex; align-items: center; gap: 6px; }
    .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--color-success); }

    /* KPIs */
    .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin: 4px 0 16px; }
    @media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
    .kpi { background: var(--color-bg-card); border: 1px solid var(--color-border-structural); border-radius: 12px; padding: 15px; }
    .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-muted); font-weight: 600; }
    .kpi-value { font-size: 24px; font-weight: 700; color: var(--color-text-primary); margin-top: 6px; line-height: 1.1; }
    .kpi-sub { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }
    .kpi.soon { opacity: .6; }
    /* token-usage KPI row on Overview — input / output / cache write / cache read / total */
    .kpi-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); font-weight: 600; margin: 4px 2px 8px; }
    .kpi-grid-tokens { grid-template-columns: repeat(5, 1fr); margin-top: 0; margin-bottom: 18px; }
    @media (max-width: 1100px) { .kpi-grid-tokens { grid-template-columns: repeat(2, 1fr); } }
    /* a hairline brand accent so the token tiles read as a related group */
    .kpi-grid-tokens .kpi { border-top: 2px solid color-mix(in srgb, #7C5CFC 55%, var(--color-border-structural)); }
    .kpi-value.muted { color: var(--color-text-muted); }

    /* grids + charts */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-32 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    @media (max-width: 1000px) { .grid-2, .grid-32 { grid-template-columns: 1fr; } }
    .chart-box { position: relative; height: 250px; }
    .mb16 { margin-bottom: 16px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
    .bar-row .nm { width: 110px; color: var(--color-text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; background: var(--color-bg-tertiary); border-radius: 6px; height: 18px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; }
    .bar-row .vl { width: 80px; text-align: right; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }

    /* agent compare cards */
    .agent-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .acard { background: var(--color-bg-card); border: 1px solid var(--color-border-structural); border-radius: 12px; padding: 16px; border-top: 3px solid var(--ac, #2297F6); }
    .acard h3 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; gap: 8px; text-transform: capitalize; }
    .acard .pill { width: 10px; height: 10px; border-radius: 50%; background: var(--ac, #2297F6); }
    .acard .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .acard .mini .l { font-size: 10.5px; color: var(--color-text-muted); text-transform: uppercase; }
    .acard .mini .v { font-size: 18px; font-weight: 700; color: var(--color-text-primary); }

    /* heatmap */
    .heatmap { display: grid; grid-template-columns: auto repeat(24, 1fr); gap: 3px; font-size: 9px; max-width: 760px; }

  // ---- small DOM builders -------------------------------------------------
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  // ---- copy-to-clipboard helper -------------------------------------------
  // getText(): () => string|undefined. label: base button text. Falls back to a
  // hidden textarea + execCommand('copy') when the Clipboard API is unavailable
  // or its promise rejects (reports are typically opened via file://, no server).
  function copyButton(getText, label) {
    var btn = el('button', 'modal-copy', esc(label));
    btn.setAttribute('aria-label', label);
    btn.addEventListener('click', function () {
      var text = getText();
      if (!text) return;
      var show = function (ok) {
        var prev = btn.textContent;
        btn.textContent = ok ? 'Copied' : 'Copy failed';
        btn.disabled = true;
        setTimeout(function () { btn.textContent = prev; btn.disabled = false; }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { show(true); }, function () { fallbackCopy(text, show); });
      } else {
        fallbackCopy(text, show);
      }
    });
    return btn;
  }
  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }
  function card(title, sub) {
    var c = el('div', 'card');
    var head = el('div', 'card-header');
    head.appendChild(el('div', 'card-title', esc(title)));
    if (sub) head.appendChild(el('span', 'text-muted', esc(sub)));
    c.appendChild(head);
    var body = el('div', 'card-body');
    c.appendChild(body);
    c._body = body;
    return c;
  }
  function dayKey(ms) { var d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function dayBuckets(fs, valueFn) {
    var m = new Map();
    fs.forEach(function (s) { var k = dayKey(s.startTime); m.set(k, (m.get(k) || 0) + (valueFn ? valueFn(s) : 1)); });
    var keys = Array.from(m.keys()).sort();
    return { labels: keys, values: keys.map(function (k) { return m.get(k); }) };
  }

    var totalCost = sum(sessions, function (s) { return s.costUSD || 0; });
    var totalTurns = sum(sessions, function (s) { return s.turns || 0; });
    var netLines = sum(sessions, function (s) { return s.netLines || 0; });
    body.appendChild(statsEl([
      ['Sessions', fmtNum(sessions.length)],
      ['Total cost', fmtUSD(totalCost)],
      ['Turns', fmtNum(totalTurns)],
      ['Net lines', (netLines >= 0 ? '+' : '') + fmtNum(netLines)]
    ]));

    var tbl = el('div', 'table-wrapper proj-sessions');
    tbl.innerHTML = tableHTML(
      ['Session', 'Date', 'Turns', 'Cost', ''],
      sorted.map(function (s) {
        return [
          // Truncate to a short preview (~12 words / 100 chars): keeps the table compact and
          // avoids exposing the full first-prompt text in the project list.
          esc(truncStr(firstWords(sessTitle(s), 12), 100)),
          esc(fmtWhen(s.startTime)),
          fmtNum(s.turns || 0),
          fmtUSD(s.costUSD || 0),
          '<button class="btn-open" data-open-session="' + esc(s.sessionId) + '">Open ↗</button>'
        ];
      }),
      [false, false, true, true, false]
    );
    tbl.addEventListener('click', function (ev) {
      var btn = ev.target.closest('[data-open-session]');
      if (!btn) return;
      var sid = btn.getAttribute('data-open-session');
      closeProjectModal();
      // Pass an onBack closure so the session modal can return to this project list.
      openSessionModal(SESSION_BY_ID[sid], function () { openProjectModal(projectPath, sessions); });
    });
    body.appendChild(tbl);
    modal.appendChild(body);
    ov.appendChild(modal);
    ov.addEventListener('click', function (ev) { if (ev.target === ov) closeProjectModal(); });
    projModalEsc = function (ev) { if (ev.key === 'Escape') closeProjectModal(); };
    document.addEventListener('keydown', projModalEsc);
    document.body.appendChild(ov);
  }

  // ---- table + misc helpers ----------------------------------------------
  function tdNum(v) { return '<span class="td-number">' + (typeof v === 'number' ? fmtNum(v) : v) + '</span>'; }
  // numericCols: optional boolean[] marking right-aligned numeric columns. Default = every
  // column except the first (back-compat). Text columns (agent, project, branch, status) must
  // be left-aligned, so callers with interleaved/leading text pass an explicit mask.
  function tableHTML(headers, rows, numericCols, rowAttrs) {
    var isNum = numericCols || headers.map(function (_, i) { return i > 0; });
    var h = '<table class="table"><thead><tr>';
    headers.forEach(function (x, i) { h += '<th' + (isNum[i] ? ' class="td-number"' : '') + '>' + esc(x) + '</th>'; });
    h += '</tr></thead><tbody>';
    if (!rows.length) h += '<tr><td colspan="' + headers.length + '" class="text-muted">No data</td></tr>';
    rows.forEach(function (r, ri) {
      var attrs = rowAttrs && rowAttrs[ri] ? ' ' + rowAttrs[ri] : '';
      h += '<tr' + attrs + '>' + r.map(function (cell, i) { return '<td' + (isNum[i] ? ' class="td-number"' : '') + '>' + cell + '</td>'; }).join('') + '</tr>';
    });
    return h + '</tbody></table>';
  }
  // tokens shorthand: cached = cacheRead + cacheCreation (the prompt-cache reuse + writes)
  function tkIn(s) { return s.tokens ? s.tokens.input : 0; }
  function tkOut(s) { return s.tokens ? s.tokens.output : 0; }
  function tkCached(s) { return s.tokens ? (s.tokens.cacheRead + s.tokens.cacheCreation) : 0; }
  function topOf(arr) { var m = {}; arr.forEach(function (x) { m[x] = (m[x] || 0) + 1; }); var best = null, bc = 0; for (var k in m) if (m[k] > bc) { bc = m[k]; best = k; } return best; }

  // ---- render + controls --------------------------------------------------
  function setTheme(light) {
    document.documentElement.classList.toggle('light', !!light);
    try { localStorage.setItem('codemie-analytics-theme', light ? 'light' : 'dark'); } catch (e) {}
    render(); // recolor charts for the new theme
  }

  function render() {
    closeSessionModal();
    applyChartTheme();
    destroyCharts();
    root.innerHTML = '';
    (VIEWS[state.view] || VIEWS.overview)(root, filtered());
    document.querySelectorAll('.nav-i').forEach(function (n) { n.classList.toggle('active', n.getAttribute('data-view') === state.view); });
  }

  function buildControls() {
    // nav
    document.querySelectorAll('.nav-i').forEach(function (n) {
      n.addEventListener('click', function () { state.view = n.getAttribute('data-view'); render(); });
    });
    // range presets (incl. Today) — selecting one clears any custom date range
    var dFrom = document.getElementById('date-from');
    var dTo = document.getElementById('date-to');
    document.querySelectorAll('#range-seg button').forEach(function (b) {
      b.addEventListener('click', function () {
        state.range = b.getAttribute('data-range');
        state.from = null; state.to = null;
        if (dFrom) dFrom.value = '';
        if (dTo) dTo.value = '';
        document.querySelectorAll('#range-seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
        render();
      });
    });
    // custom date range — applies on change, deactivates the preset segment
    function onDateChange() {
      state.from = parseLocalDate(dFrom && dFrom.value, false);
      state.to = parseLocalDate(dTo && dTo.value, true);
      if (state.from != null || state.to != null) {
        state.range = 'custom';
        document.querySelectorAll('#range-seg button').forEach(function (x) { x.classList.remove('on'); });
      }
      render();
    }
    if (dFrom) dFrom.addEventListener('change', onDateChange);
    if (dTo) dTo.addEventListener('change', onDateChange);
    var dClear = document.getElementById('date-clear');
    if (dClear) dClear.addEventListener('click', function () {
      state.from = null; state.to = null;
      if (dFrom) dFrom.value = '';
      if (dTo) dTo.value = '';
      state.range = 'all';
      document.querySelectorAll('#range-seg button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-range') === 'all'); });
      render();
    });
    // agent chips
    var chips = document.getElementById('agent-chips');
    DATA.meta.agents.forEach(function (a) {
      var chip = el('span', 'chip-tog');
      chip.innerHTML = '<span class="dot" style="background:' + colorFor(a) + '"></span>' + esc(labelFor(a));
      chip.addEventListener('click', function () {
        if (state.agents.has(a)) { state.agents.delete(a); chip.classList.add('off'); }
        else { state.agents.add(a); chip.classList.remove('off'); }
        render();
      });
      chips.appendChild(chip);
    });
    // project select
    var sel = document.getElementById('project-select');
    var projects = Array.from(new Set(DATA.sessions.map(function (s) { return s.project; }))).sort();
    sel.innerHTML = '<option value="all">All projects (' + projects.length + ')</option>' + projects.map(function (p) { return '<option value="' + esc(p) + '">' + esc(shortPath(p)) + '</option>'; }).join('');
    sel.addEventListener('change', function () { state.project = sel.value; render(); });
    // footer
    document.getElementById('side-foot').innerHTML = fmtNum(DATA.meta.totals.sessions) + ' sessions<br>' + DATA.meta.agents.length + ' agents<br>generated ' + esc((DATA.meta.generatedAt || '').slice(0, 10));
    // theme switch (bottom-left)
    var sw = document.getElementById('theme-switch');
    if (sw) {
      var label = sw.querySelector('.ts-text');
      function syncThemeText() { if (label) label.textContent = document.documentElement.classList.contains('light') ? 'Light' : 'Dark'; }
      function toggleTheme() { setTheme(!document.documentElement.classList.contains('light')); syncThemeText(); }
      sw.addEventListener('click', toggleTheme);
      sw.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); } });
      syncThemeText();
    }
  }

  // apply saved theme before first paint. Default = dark (CodeMie's product default);
  // only an explicit saved choice flips it to light.
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem('codemie-analytics-theme'); } catch (e) {}
    document.documentElement.classList.toggle('light', saved === 'light');
  })();

  buildControls();
  render();
})();
</script>
</body>
</html>
